<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Venda</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #1e1e1e; padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 350px; }
        .loja { color: #aaaaaa; font-size: 14px; margin-bottom: 5px; }
        .produto { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        .preco { color: #2ecc71; font-size: 32px; font-weight: bold; margin-bottom: 20px; }
        .btn { background-color: #008000; color: white; text-decoration: none; padding: 15px; border-radius: 10px; display: block; font-weight: bold; }
    </style>
</head>
<body>

<div class="card" id="conteudo">
    <p>Carregando...</p>
</div>

<script>
    // Use a sua URL do Firebase que está no strings.xml
    const firebaseConfig = {
        databaseURL: "https://dalesteflix-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);

    const urlParams = new URLSearchParams(window.location.search);
    const idVenda = urlParams.get('id');

    if (idVenda) {
        firebase.database().ref('vendas/' + idVenda).once('value').then((snapshot) => {
            const data = snapshot.val();
            if (data) {
                // CORREÇÃO: Usando 'precoProduto' para bater com o Java
                document.getElementById('conteudo').innerHTML = `
                    <div class="loja">${data.nomeLoja}</div>
                    <div class="produto">${data.nomeProduto}</div>
                    <div class="preco">R$ ${data.precoProduto}</div>
                    <a href="https://wa.me/${data.whatsVendas}" class="btn">Comprar pelo WhatsApp</a>
                `;
            } else {
                document.getElementById('conteudo').innerHTML = "Venda não encontrada.";
            }
        });
    }
</script>

</body>
</html>
